<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Inter"; font-weight: 400; src: url("assets/fonts/inter-latin-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 600; src: url("assets/fonts/inter-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 800; src: url("assets/fonts/inter-latin-800-normal.woff2") format("woff2"); }
      @font-face { font-family: "JetBrains Mono"; font-weight: 500; src: url("assets/fonts/jetbrains-mono-latin-500-normal.woff2") format("woff2"); }

      :root {
        --brand: #38488f;
        --ink: #1d1d1f;
        --muted: #6b6b76;
        --card: #fdfdff;
        --bg: #f0f0f2;
        --line: #dcdce3;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
        color: var(--ink);
        background: radial-gradient(1200px 700px at 50% 45%, #ffffff 0%, var(--bg) 70%);
      }
      #scene {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 40px;
        width: 100%;
        height: 100%;
        padding: 120px 160px;
      }

      /* Address bar */
      #bar {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 22px;
        width: 820px;
        height: 92px;
        padding: 0 36px;
        border-radius: 46px;
        background: var(--card);
        box-shadow: 0 1px 0 var(--line), 0 18px 50px rgba(29, 29, 31, 0.10);
      }
      #lock { width: 26px; height: 30px; flex-shrink: 0; }
      #url { font-family: "JetBrains Mono", ui-monospace, monospace; font-weight: 500; font-size: 36px; letter-spacing: -0.01em; display: flex; align-items: center; }
      #url .ch { display: inline-block; }
      #caret { display: inline-block; width: 3px; height: 40px; margin-left: 4px; background: var(--brand); }

      /* Page card */
      #card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 34px;
        width: 1240px;
        height: 560px;
        border-radius: 36px;
        background: var(--card);
        box-shadow: 0 1px 0 var(--line), 0 40px 90px rgba(29, 29, 31, 0.12);
        transform-origin: 50% 0%;
      }
      #headline { display: flex; gap: 32px; font-size: 128px; font-weight: 800; letter-spacing: -0.045em; line-height: 1; }
      #headline span { display: inline-block; }
      #headline .em { color: var(--brand); }
      #slot { position: relative; width: 1000px; height: 64px; }
      .claim {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 52px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: var(--muted);
      }
      .claim b { color: var(--brand); font-weight: 800; margin-right: 0.28em; }
      .claim.tag { font-size: 44px; color: var(--ink); }
      #underline { width: 0; height: 6px; border-radius: 3px; background: var(--brand); }
      #cta {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 18px 34px;
        border-radius: 999px;
        background: var(--brand);
        color: var(--card);
        font-size: 28px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-dpn5" id="root" data-composition-id="main" data-start="0" data-duration="10" data-fps="30" data-width="1920" data-height="1080">
      <div data-hf-id="hf-q91z" id="main-clip" class="clip" data-start="0" data-duration="10" data-track-index="0" style="width: 100%; height: 100%">
        <div data-hf-id="hf-31ev" id="scene">
          <div data-hf-id="hf-2to0" id="bar">
            <svg data-hf-id="hf-uxva" id="lock" viewBox="0 0 26 30" aria-hidden="true">
              <rect data-hf-id="hf-1lfa" x="1" y="12" width="24" height="17" rx="4" fill="var(--brand)" />
              <path data-hf-id="hf-jhwy" d="M6 12V9a7 7 0 0 1 14 0v3" fill="none" stroke="var(--brand)" stroke-width="3" />
            </svg>
            <div data-hf-id="hf-do48" id="url"><span data-hf-id="hf-ngrb" id="caret"></span></div>
          </div>

          <div data-hf-id="hf-55rf" id="card">
            <div data-hf-id="hf-gj8t" id="headline"><span data-hf-id="hf-lml4" id="w1">Example</span><span data-hf-id="hf-66d2" id="w2" class="em">Domain</span></div>
            <div data-hf-id="hf-x55n" id="underline"></div>
            <div data-hf-id="hf-90kp" id="slot">
              <div data-hf-id="hf-ajjy" class="claim" id="c1"><b data-hf-id="hf-9r2w">Made</b>for examples.</div>
              <div data-hf-id="hf-h5v6" class="claim" id="c2"><b data-hf-id="hf-0j4r">Free</b>to use in your docs.</div>
              <div data-hf-id="hf-dxci" class="claim" id="c3"><b data-hf-id="hf-t7ne">No</b>permission needed.</div>
              <div data-hf-id="hf-00eh" class="claim tag" id="c4">One domain for every example.</div>
            </div>
            <div data-hf-id="hf-naxp" id="cta">Visit example.com <span data-hf-id="hf-p70p">→</span></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Build the typed URL as one span per character (seek-safe typewriter).
      const URL_TEXT = "example.com";
      const urlEl = document.getElementById("url");
      const caret = document.getElementById("caret");
      URL_TEXT.split("").forEach((c, i) => {
        const s = document.createElement("span");
        s.className = "ch";
        s.id = "ch" + i;
        s.textContent = c;
        urlEl.insertBefore(s, caret);
      });
      const chars = URL_TEXT.split("").map((_, i) => "#ch" + i);

      const BAR_DROP = 326; // (card height + gap) / 2: bar starts centered on the frame
      const tl = gsap.timeline({ paused: true });

      // Hook (0–2.4): bar arrives centered, URL types in, caret blinks.
      tl.fromTo("#bar", { y: BAR_DROP + 40, autoAlpha: 0, scale: 0.94 }, { y: BAR_DROP, autoAlpha: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 0);
      tl.set("#card", { autoAlpha: 0, scaleY: 0.04, scaleX: 0.62, y: 0 }, 0);
      tl.set("#cta", { autoAlpha: 0, y: 24 }, 0);
      tl.set("#w2", { scale: 1 }, 0);
      chars.forEach((sel, i) => {
        tl.fromTo(sel, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.01 }, 0.45 + i * 0.09);
      });
      tl.fromTo("#caret", { autoAlpha: 1 }, { autoAlpha: 0, duration: 0.25, ease: "none", repeat: 3, yoyo: true }, 1.4);

      // Build (2.4–4.6): bar lifts, the page card grows out of it, headline rises word by word.
      tl.to("#bar", { y: 0, duration: 0.7, ease: "power3.inOut" }, 2.4);
      tl.to("#caret", { autoAlpha: 0, duration: 0.1 }, 2.4);
      tl.to("#card", { autoAlpha: 1, scaleY: 1, scaleX: 1, duration: 0.75, ease: "expo.out" }, 2.55);
      tl.fromTo("#w1", { y: 70, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.55, ease: "power4.out" }, 2.95);
      tl.fromTo("#w2", { y: 70, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.55, ease: "power4.out" }, 3.15);
      tl.fromTo("#underline", { width: 0 }, { width: 260, duration: 0.6, ease: "power3.inOut" }, 3.6);

      // Punch (4.6–7.6): three claims slam in, one per beat.
      [4.6, 5.6, 6.6].forEach((t, i) => {
        const sel = "#c" + (i + 1);
        tl.fromTo(sel, { autoAlpha: 0, scale: 1.35 }, { autoAlpha: 1, scale: 1, duration: 0.32, ease: "back.out(2)" }, t);
        tl.to(sel, { autoAlpha: 0, y: -28, duration: 0.22, ease: "power2.in" }, t + 0.82);
      });
      tl.to("#w2", { scale: 1.06, duration: 0.16, ease: "sine.out", yoyo: true, repeat: 1 }, 6.6);

      // Resolve (7.6–10): tagline + CTA lockup, hold.
      tl.fromTo("#c4", { autoAlpha: 0, y: 24, scale: 1 }, { autoAlpha: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" }, 7.65);
      tl.to("#underline", { width: 420, duration: 0.6, ease: "power3.inOut" }, 7.65);
      tl.to("#cta", { autoAlpha: 1, y: 0, duration: 0.5, ease: "back.out(1.6)" }, 8.0);
      tl.to("#card", { y: -6, duration: 2, ease: "sine.inOut" }, 8.0);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
